name: Build PLUHTUNE (Windows)
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        shell: pwsh
        run: |
          $zip = (Get-ChildItem -Filter *.zip | Select-Object -First 1).FullName
          Expand-Archive -Path $zip -DestinationPath src
          Get-ChildItem -Recurse src | Select-Object -First 20 FullName
      - name: Configure
        run: cmake -S src/PLUHTUNE -B build -G "Visual Studio 17 2022" -A x64
      - name: Build standalone and VST3
        run: |
          cmake --build build --config Release --target PLUHTUNE_Standalone
          cmake --build build --config Release --target PLUHTUNE_VST3
      - uses: actions/upload-artifact@v4
        with:
          name: PLUHTUNE-windows
          path: |
            build/PLUHTUNE_artefacts/Release/Standalone/PLUHTUNE.exe
            build/PLUHTUNE_artefacts/Release/VST3/PLUHTUNE.vst3

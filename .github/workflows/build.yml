name: Build PLUHTUNE (Windows)
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Recurse -Filter *.zip | Sort-Object Name -Descending | Select-Object -First 1
          if ($zip) {
            Expand-Archive -Path $zip.FullName -DestinationPath src -Force
            $cm = Get-ChildItem -Recurse src -Filter CMakeLists.txt | Where-Object { Select-String -Path $_.FullName -Pattern 'juce_add_plugin' -Quiet } | Select-Object -First 1
          } else {
            $cm = Get-ChildItem -Recurse -Filter CMakeLists.txt | Where-Object { Select-String -Path $_.FullName -Pattern 'juce_add_plugin' -Quiet } | Select-Object -First 1
          }
          if (-not $cm) { Write-Host "No project found"; Get-ChildItem -Recurse | Select-Object -First 60 FullName; exit 1 }
          Write-Host "Project folder: $($cm.DirectoryName)"
          "PROJECT_DIR=$($cm.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Configure
        shell: pwsh
        run: cmake -S "$env:PROJECT_DIR" -B build
      - name: Build standalone and VST3
        shell: pwsh
        run: |
          cmake --build build --config Release --target PLUHTUNE_Standalone
          cmake --build build --config Release --target PLUHTUNE_VST3
      - uses: actions/upload-artifact@v4
        with:
          name: PLUHTUNE-windows
          path: |
            build/PLUHTUNE_artefacts/Release/Standalone/PLUHTUNE.exe
            build/PLUHTUNE_artefacts/Release/VST3/PLUHTUNE.vst3
